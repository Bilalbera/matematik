<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Yarışı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Bilal Bera Cantekin tarafından yapıldı</p>
    </div>

    <main id="app">
        <div id="menu" class="screen active">
            <h1>Matematik Yarışı</h1>
            <button onclick="showModeSelection()">Oyuna Başla</button>
        </div>

        <div id="mode-selection" class="screen">
            <h2>Mod Seçin</h2>
            <button onclick="startGame('single')">Tek Oyuncu</button>
            <button onclick="startGame('multi')">İki Kişi (1v1)</button>
        </div>

        <div id="game-screen" class="screen">
            <div id="timer">100</div>
            <div id="game-container">
                <div id="player1-area" class="player-zone"></div>
                <div id="question-box">? x ?</div>
                <div id="player2-area" class="player-zone"></div>
            </div>
            <input type="number" id="answer-input" placeholder="Cevap" autofocus>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
