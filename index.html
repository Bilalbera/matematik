<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mega Portal | Matematik Yarışı</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            transition: all 0.4s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: -webkit-linear-gradient(#00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
            width: 100%;
            max-width: 300px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.6);
        }

        .btn-alt {
            background: linear-gradient(45deg, #ff9966, #ff5e62);
            box-shadow: 0 4px 15px rgba(255, 94, 98, 0.4);
        }

        .btn-alt:hover {
            box-shadow: 0 8px 25px rgba(255, 94, 98, 0.6);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f2027;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader {
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #00d2ff;
            border-radius: 50%;
            width: 60px; height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .creator-text {
            font-size: 1rem;
            color: #aaa;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        .hidden { display: none !important; }

        /* Game UI */
        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .question-box {
            font-size: 4rem;
            font-weight: 800;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            max-width: 250px;
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
            transition: border 0.3s;
        }

        input[type="number"]:focus {
            border-color: #00d2ff;
        }

        .player-zones {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .player-zone {
            flex: 1;
            min-width: 140px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-zone h3 { margin-bottom: 10px; font-size: 1rem; color: #00d2ff;}
        .player-zone.p2 h3 { color: #ff9966; }

        #timer {
            color: #ff5e62;
            font-size: 1.5rem;
            font-weight: 800;
        }

        /* Result Screen */
        #result-screen h2 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .question-box { font-size: 3rem; }
            .glass-panel { padding: 25px; width: 95%; }
            .player-zones { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <div class="creator-text">Bilal Bera Cantekin tarafından yapıldı</div>
    </div>

    <div id="main-menu" class="glass-panel hidden">
        <h1>Mega Oyun Portalı</h1>
        <p style="margin-bottom: 30px; color: #ccc;">Sınırlarını zorlamaya hazır mısın?</p>
        <button class="btn" onclick="showModeSelection()">Matematik Yarışı</button>
    </div>

    <div id="mode-selection" class="glass-panel hidden">
        <h1>Mod Seçimi</h1>
        <button class="btn" onclick="startGame('single')">Tek Oyuncu</button>
        <button class="btn btn-alt" onclick="startGame('1v1')">1v1 (İki Kişi)</button>
        <button class="btn" style="background: transparent; border: 1px solid #fff; box-shadow: none;" onclick="goBack()">Geri Dön</button>
    </div>

    <div id="game-screen" class="glass-panel hidden">
        <div class="header-info">
            <span id="score-display">Puan: 0</span>
            <span id="timer">100s</span>
        </div>
        
        <div class="question-box" id="question-text">? x ?</div>

        <div id="single-input" class="input-group hidden">
            <input type="number" id="answer-input" placeholder="Cevap..." onkeypress="checkEnter(event, 'single')">
            <button class="btn" onclick="checkAnswer('single')">Gönder</button>
        </div>

        <div id="1v1-input" class="player-zones hidden">
            <div class="player-zone">
                <h3>Oyuncu 1</h3>
                <input type="number" id="p1-input" placeholder="Cevap..." onkeypress="checkEnter(event, 'p1')">
                <button class="btn" style="padding: 10px; font-size: 1rem; margin-top: 10px;" onclick="checkAnswer('p1')">Gönder</button>
            </div>
            <div class="player-zone p2">
                <h3>Oyuncu 2</h3>
                <input type="number" id="p2-input" placeholder="Cevap..." onkeypress="checkEnter(event, 'p2')">
                <button class="btn btn-alt" style="padding: 10px; font-size: 1rem; margin-top: 10px;" onclick="checkAnswer('p2')">Gönder</button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="glass-panel hidden">
        <h1>Süre Doldu!</h1>
        <h2 id="final-result-text">Skor</h2>
        <p id="winner-text" style="font-size: 1.2rem; margin-bottom: 20px; color: #aaa;"></p>
        <button class="btn" onclick="showMainMenu()">Ana Menüye Dön</button>
    </div>

    <script>
        // Yükleme Ekranı Simülasyonu
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-menu').classList.remove('hidden');
                }, 500);
            }, 2000); // 2 saniye yükleme ekranı
        };

        // Değişkenler
        let currentMode = 'single';
        let timeLeft = 100;
        let timerInterval;
        let p1Score = 0;
        let p2Score = 0;
        let correctAnswer = 0;

        // Navigasyon Fonksiyonları
        function showModeSelection() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('mode-selection').classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function showMainMenu() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        // Oyun Başlatma
        function startGame(mode) {
            currentMode = mode;
            p1Score = 0;
            p2Score = 0;
            timeLeft = 100;
            
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            if(mode === 'single') {
                document.getElementById('single-input').classList.remove('hidden');
                document.getElementById('1v1-input').classList.add('hidden');
                updateScoreDisplay();
            } else {
                document.getElementById('single-input').classList.add('hidden');
                document.getElementById('1v1-input').classList.remove('hidden');
                updateScoreDisplay();
            }

            generateQuestion();
            startTimer();
            
            // Focus on input
            setTimeout(() => {
                if(mode === 'single') document.getElementById('answer-input').focus();
            }, 100);
        }

        // Soru Üretme (Çarpma)
        function generateQuestion() {
            // Hızlı ve refleksif olması için 2 ile 12 arası sayılar
            let num1 = Math.floor(Math.random() * 11) + 2; 
            let num2 = Math.floor(Math.random() * 11) + 2;
            correctAnswer = num1 * num2;
            document.getElementById('question-text').innerText = `${num1} x ${num2}`;
            
            // Inputları temizle
            document.getElementById('answer-input').value = '';
            document.getElementById('p1-input').value = '';
            document.getElementById('p2-input').value = '';
        }

        // Enter Tuşu Kontrolü
        function checkEnter(event, player) {
            if (event.key === "Enter") {
                checkAnswer(player);
            }
        }

        // Cevap Kontrolü
        function checkAnswer(player) {
            let inputId = player === 'single' ? 'answer-input' : (player === 'p1' ? 'p1-input' : 'p2-input');
            let userAnswer = parseInt(document.getElementById(inputId).value);

            if (userAnswer === correctAnswer) {
                if (player === 'single' || player === 'p1') p1Score++;
                if (player === 'p2') p2Score++;
                
                updateScoreDisplay();
                generateQuestion();
                
                // Animasyon efekti
                document.getElementById('question-text').style.color = '#38ef7d';
                setTimeout(() => { document.getElementById('question-text').style.color = '#fff'; }, 200);
            } else {
                // Yanlış cevap efekti
                document.getElementById(inputId).style.borderColor = '#ff5e62';
                setTimeout(() => { document.getElementById(inputId).style.borderColor = 'rgba(255,255,255,0.3)'; }, 400);
                document.getElementById(inputId).value = '';
            }
            document.getElementById(inputId).focus();
        }

        // Skor Tablosu Güncelleme
        function updateScoreDisplay() {
            if (currentMode === 'single') {
                document.getElementById('score-display').innerText = `Puan: ${p1Score}`;
            } else {
                document.getElementById('score-display').innerText = `O1: ${p1Score} | O2: ${p2Score}`;
            }
        }

        // Zamanlayıcı
        function startTimer() {
            document.getElementById('timer').innerText = `${timeLeft}s`;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `${timeLeft}s`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        // Oyun Bitişi
        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            let finalResultText = document.getElementById('final-result-text');
            let winnerText = document.getElementById('winner-text');

            if (currentMode === 'single') {
                finalResultText.innerText = `Skorun: ${p1Score}`;
                winnerText.innerText = "Tebrikler, harika yarıştın!";
            } else {
                finalResultText.innerText = `Skor: ${p1Score} - ${p2Score}`;
                if (p1Score > p2Score) {
                    winnerText.innerText = "🏆 Oyuncu 1 Kazandı!";
                    winnerText.style.color = "#00d2ff";
                } else if (p2Score > p1Score) {
                    winnerText.innerText = "🏆 Oyuncu 2 Kazandı!";
                    winnerText.style.color = "#ff9966";
                } else {
                    winnerText.innerText = "🤝 Berabere Bitti!";
                    winnerText.style.color = "#fff";
                }
            }
        }
    </script>
</body>
</html>
