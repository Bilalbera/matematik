<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. Sınıf 2026 Bilgi Yarışması</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        #quiz-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--dark);
        }
        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--dark);
        }
        .options {
            display: grid;
            gap: 10px;
        }
        button {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }
        button:hover {
            background-color: #f0f0f0;
            border-color: var(--primary);
        }
        .correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }
        .wrong {
            background-color: var(--danger) !important;
            color: white;
            border-color: var(--danger);
        }
        #result {
            display: none;
        }
        .score-box {
            font-size: 2rem;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="game-zone">
        <div class="header">
            <span>Soru: <span id="q-num">1</span>/10</span>
            <span>Puan: <span id="score">0</span></span>
        </div>
        <div class="question" id="question-text">Soru yükleniyor...</div>
        <div class="options" id="options-container">
            </div>
    </div>

    <div id="result">
        <h1>Sınav Tamamlandı!</h1>
        <div class="score-box">Toplam Puanın: <span id="final-score">0</span> / 100</div>
        <button onclick="location.reload()">Tekrar Dene</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Güneş sistemindeki en büyük gezegen hangisidir?", a: "Jüpiter", options: ["Mars", "Satürn", "Jüpiter", "Venüs"] },
        { q: "Hangi kelime türemiş bir sözcüktür?", a: "Gözlük", options: ["Elma", "Gözlük", "Kedi", "Masa"] },
        { q: "Bir açının bütünleri 110 derece ise bu açı kaç derecedir?", a: "70", options: ["80", "70", "90", "100"] },
        { q: "Kandaki oksijeni taşıyan hücre hangisidir?", a: "Alyuvar", options: ["Akyuvar", "Kan pulcukları", "Alyuvar", "Plazma"] },
        { q: "İslamiyet öncesi Türk devletlerinde devlet işlerinin görüşüldüğü meclise ne denir?", a: "Kurultay", options: ["Divan", "Kurultay", "Toy", "Meclis"] },
        { q: "Hangi sayı hem 2'ye hem 3'e tam bölünür?", a: "12", options: ["10", "12", "15", "8"] },
        { q: "Sıvıların hacmi ne ile ölçülür?", a: "Dereceli silindir", options: ["Terazi", "Dereceli silindir", "Metre", "Dinamometre"] },
        { q: "İlk Türk İslam devletlerinde kervansaraylar ne amaçla yapılmıştır?", a: "Ticaret", options: ["Eğitim", "Savunma", "Ticaret", "Tarım"] },
        { q: "Hücrenin yönetim merkezi neresidir?", a: "Çekirdek", options: ["Sitoplazma", "Çekirdek", "Mitokondri", "Koful"] },
        { q: "Aşağıdakilerden hangisi bir edat (ilgeç) tır?", a: "Gibi", options: ["Ve", "Ama", "Gibi", "Çünkü"] }
    ];

    let currentQuestionIndex = 0;
    let totalScore = 0;
    const maxScore = 100;

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById("q-num").innerText = currentQuestionIndex + 1;
        document.getElementById("question-text").innerText = q.q;
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = String.fromCharCode(65 + index) + ") " + opt;
            btn.onclick = () => checkAnswer(opt, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        const correct = questions[currentQuestionIndex].a;
        const buttons = document.querySelectorAll("#options-container button");
        
        buttons.forEach(b => b.disabled = true);

        if (selected === correct) {
            btn.classList.add("correct");
            // Rastgele puan ekle (Her soru yaklasik 10 puan ama rastgelelik olsun dendiği için)
            let randomPoints = Math.floor(Math.random() * 5) + 8; // 8-12 arası puan
            totalScore += randomPoints;
            if(totalScore > 100) totalScore = 100; // Maksimum 100 sınırı
        } else {
            btn.classList.add("wrong");
            buttons.forEach(b => {
                if(b.innerText.includes(correct)) b.classList.add("correct");
            });
        }

        document.getElementById("score").innerText = totalScore;

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }, 1500);
    }

    function showResult() {
        document.getElementById("game-zone").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("final-score").innerText = totalScore;
    }

    loadQuestion();
</script>

</body>
</html>
